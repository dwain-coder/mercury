# Documented attributes for "泊まる街を選ぶ" (/choose/). The recommendation is nothing more
# than these attributes matched against what the reader selects — the page shows the whole
# table and the arithmetic, so a reader can check every point.
#
# Only attributes with a source are here. Price level, quietness, safety and "atmosphere" are
# deliberately absent: there is no documented measure behind them, so they are not scored.
#
# traits are keyed; each trait names the source that documents it for that area.

