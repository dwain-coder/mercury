# Factors are 1–5 editor estimates until search data is attached; set demand_basis to "gsc" or
# "dataforseo" when a real number replaces the estimate. `blocked_by` is the reason an idea
# cannot be written honestly yet (usually: needs on-foot research or verified prices).
